{{- if and .Values.digest.enabled .Values.digest.webhookExternalSecret.enabled }}
{{- $es := .Values.digest.webhookExternalSecret }}
# The digest is only useful if it arrives somewhere a human reads. The webhook
# URL is a credential (a Discord webhook can post as the bot), so it comes from
# Bitwarden through the same ClusterSecretStore as every other secret in this
# cluster — never from Git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ required "digest.webhookSecretName is required when digest.webhookExternalSecret is enabled" .Values.digest.webhookSecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "egress.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    name: {{ $es.secretStoreRef.name }}
    kind: {{ $es.secretStoreRef.kind }}
  target:
    name: {{ .Values.digest.webhookSecretName }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.digest.webhookSecretKey }}
      remoteRef:
        key: {{ required "digest.webhookExternalSecret.remoteRefKey is required" $es.remoteRefKey }}
{{- end }}
