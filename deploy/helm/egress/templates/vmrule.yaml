{{- if .Values.monitoring.vmrule.enabled }}
# Two layers, deliberately: the raw deny record in Postgres (for the review
# queue) and these metrics (for "is this happening now"). Suppression lives in
# the weekly digest, not in the alert, so the alert cannot quietly rot.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: egress-alerts
  {{- with .Values.monitoring.vmrule.namespace }}
  namespace: {{ . }}
  {{- end }}
  # No chart labels here on purpose: VMAlert's ruleSelector wants a specific
  # label set (e.g. app.kubernetes.io/instance: victoria) and a duplicate key
  # would make the object invalid.
  labels:
    app.kubernetes.io/part-of: egress
    {{- with .Values.monitoring.vmrule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: egress
      rules:
        - alert: EgressDenyUnknown
          expr: |
            sum by (source_namespace, source, destination, direction) (
              increase(hubble_policy_verdicts_total{action="dropped", direction="egress"}[15m])
            ) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "egress denied for {{ "{{" }} $labels.source_namespace {{ "}}" }}/{{ "{{" }} $labels.source {{ "}}" }} → {{ "{{" }} $labels.destination {{ "}}" }}"
            runbook: "docs/runbooks/egress-deny.md"

        - alert: EgressDenySpike
          expr: |
            sum by (source_namespace, source) (
              increase(hubble_policy_verdicts_total{action="dropped", direction="egress"}[5m])
            ) > 30
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "deny spike for {{ "{{" }} $labels.source_namespace {{ "}}" }}/{{ "{{" }} $labels.source {{ "}}" }} (possible compromise or broken dependency)"

        - alert: EgressExporterMissing
          expr: min by (instance) (hubble_dynamic_exporter_exporters_total{status="active"}) < 3
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "{{ "{{" }} $labels.instance {{ "}}" }} has fewer than 3 egress flow-log exporters active — capture, and therefore the review queue, is incomplete"

        - alert: EgressCollectorStale
          expr: time() - max(egressd_last_write_timestamp_seconds) > 300
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "egressd has not written to Postgres for over 5 minutes — deny history is being lost"

        - alert: EgressExporterDrops
          expr: increase(hubble_lost_events_total[15m]) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Hubble ring buffer overflowed on {{ "{{" }} $labels.instance {{ "}}" }} — raise eventBufferCapacity or narrow the exporter filters"

        - alert: EgressPostgresFillingUp
          expr: |
            max(kubelet_volume_stats_used_bytes{namespace="cnpg-system"}
                / kubelet_volume_stats_capacity_bytes{namespace="cnpg-system"}) > 0.70
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "CNPG volume is over 70% full — review the egress retention windows"
{{- end }}
