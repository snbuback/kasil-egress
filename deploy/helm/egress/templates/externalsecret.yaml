{{- if .Values.postgres.externalSecret.enabled }}
# The DSN is a credential: it comes from Bitwarden, never from Git. The item
# must hold a full libpq URI (including the password) under remoteRefKey.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.postgres.dsnSecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "egress.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.postgres.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.postgres.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ .Values.postgres.dsnSecretName }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.postgres.dsnSecretKey }}
      remoteRef:
        key: {{ .Values.postgres.externalSecret.remoteRefKey }}
{{- end }}
