{{- if .Values.postgres.externalSecret.enabled }}
{{- $es := .Values.postgres.externalSecret }}
{{- $c := $es.compose }}
# The DSN is a credential: it comes from Bitwarden, never from Git. Either the
# item holds the full libpq URI, or `compose` builds it from the role password
# (one Bitwarden item per database, not two).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.postgres.dsnSecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "egress.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ $es.secretStoreRef.name }}
    kind: {{ $es.secretStoreRef.kind }}
  target:
    name: {{ .Values.postgres.dsnSecretName }}
    creationPolicy: Owner
    {{- if $c.enabled }}
    template:
      engineVersion: v2
      type: Opaque
      data:
        {{ .Values.postgres.dsnSecretKey }}: 'postgres://{{ $c.username }}:{{ "{{ .password | urlquery }}" }}@{{ $c.host }}:{{ $c.port }}/{{ $c.database }}'
    {{- end }}
  data:
    {{- if $c.enabled }}
    - secretKey: password
      remoteRef:
        key: {{ required "postgres.externalSecret.compose.passwordKey is required when compose is enabled" $c.passwordKey }}
    {{- else }}
    - secretKey: {{ .Values.postgres.dsnSecretKey }}
      remoteRef:
        key: {{ required "postgres.externalSecret.remoteRefKey is required" $es.remoteRefKey }}
    {{- end }}
{{- end }}
