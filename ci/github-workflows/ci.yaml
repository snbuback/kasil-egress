name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags-ignore: ["**"]

permissions:
  contents: read

env:
  # `helm template` has no live cluster to discover CRDs from, so the chart's
  # CRD-gated objects must be told they exist.
  HELM_API_VERSIONS: >-
    --api-versions monitoring.coreos.com/v1
    --api-versions external-secrets.io/v1
    --api-versions operator.victoriametrics.com/v1beta1

jobs:
  go:
    name: go / test + vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "gofmt needed for:"; echo "$out"; exit 1; fi
      - run: go vet ./...
      - run: go test ./... -count=1
      - name: Cross-build for the cluster (linux/arm64)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o /tmp/egressd ./cmd/egressd
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o /tmp/egressctl ./cmd/egressctl

  chart:
    name: chart / lint + render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: lint
        run: helm lint deploy/helm/egress --values deploy/helm/egress/ci-values.yaml
      - name: render (default)
        run: helm template egress deploy/helm/egress --namespace egress $HELM_API_VERSIONS > /tmp/default.yaml
      - name: render (all features)
        run: helm template egress deploy/helm/egress --namespace egress $HELM_API_VERSIONS --values deploy/helm/egress/ci-values.yaml > /tmp/full.yaml
      - name: every document has a kind and a name
        run: |
          set -euo pipefail
          for f in /tmp/default.yaml /tmp/full.yaml; do
            n="$(yq -N 'select(.kind != null) | .kind' "$f" | wc -l)"
            [ "$n" -ge 8 ] || { echo "$f rendered only $n objects"; exit 1; }
            bad="$(yq -N 'select(.kind != null and (.metadata.name == null)) | .kind' "$f")"
            [ -z "$bad" ] || { echo "objects without a name in $f: $bad"; exit 1; }
          done
      - name: render the collector disabled
        run: |
          set -euo pipefail
          if helm template egress deploy/helm/egress --namespace egress $HELM_API_VERSIONS --set collector.enabled=false | grep -q 'kind: DaemonSet'; then
            echo "collector.enabled=false still rendered a DaemonSet"
            exit 1
          fi
      - name: render a committed policy (the Phase 2 delivery path)
        run: |
          set -euo pipefail
          # Regression: templates/policies-generated.yaml must glob the
          # directory policies are actually committed to (files/policies/).
          # It once globbed policies/, so every committed allowlist rendered
          # nothing and ArgoCD applied nothing - and the object-count check
          # above still passed. A fixture is the only way to catch that.
          tmp="$(mktemp -d)"
          cp -r deploy/helm/egress "$tmp/chart"
          mkdir -p "$tmp/chart/files/policies/ci"
          cp ci/fixtures/fixture-policy.yaml "$tmp/chart/files/policies/ci/ci-fixture-egress.yaml"
          helm template egress "$tmp/chart" --namespace egress $HELM_API_VERSIONS > /tmp/with-policy.yaml
          grep -q 'name: ci-fixture-egress' /tmp/with-policy.yaml

  policies:
    name: policies / lint generated files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: lint every committed policy
        run: |
          if [ -d deploy/helm/egress/files/policies ]; then
            go run ./cmd/egressctl lint deploy/helm/egress/files/policies --live=false
          else
            echo "no committed policies yet (expected during Phase 1)"
          fi
